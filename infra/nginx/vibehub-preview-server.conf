# 每个 preview_id 独立 origin。此文件是独立 443 server，不要 include 到主域 server 块中。
# 前置条件：*.preview.supermind-ai.cn 的 wildcard DNS 与证书已经就绪。
server {
    listen 443 ssl http2;
    server_name "~^(?<vh_pid>[a-z0-9]{16})\.preview\.supermind-ai\.cn$";

    ssl_certificate /etc/letsencrypt/live/preview.supermind-ai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.supermind-ai.cn/privkey.pem;

    # claim 仅在首个 query 中短暂出现。access/error log 都不得持久化请求行；
    # upstream 故障由应用健康检查与主服务日志监控，预览虚拟主机不记录 query。
    access_log off;
    error_log /dev/null crit;

    location ~ "^/vibehub/_preview/[a-z0-9]{16}(/.*)?$" {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /vibehub/_sdk/vibehub.js {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /baas/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Vibehub-Project "";
    }

    location / { return 404; }
}
