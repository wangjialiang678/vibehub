# VibeHub 生产 nginx 配置（南京机）
#
# 决策 2 是路径式网址，所以：
#   作品   https://supermind-ai.cn/vibehub/<username>/<project>/
#   预览   https://supermind-ai.cn/vibehub/_preview/<pid>/
#   控制台 https://hub.supermind-ai.cn/          ← 必须是另一个 origin
#
# 为什么控制台要换 origin：路径式下作品和平台同源，学员作品里的 JS
# 能直接 document.cookie 读到老师的登录态。换个子域就隔开了。
# 平台 cookie 必须是 host-only（不设 Domain），否则仍会下发到主域。
#
# 证书：路径式不需要通配证书，HTTP-01 即可（80 已通）：
#   certbot --nginx -d supermind-ai.cn -d www.supermind-ai.cn -d hub.supermind-ai.cn

# ── 主域：超脑官网 + 学员作品 ────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name supermind-ai.cn www.supermind-ai.cn;

    ssl_certificate     /etc/letsencrypt/live/supermind-ai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supermind-ai.cn/privkey.pem;

    root /var/www/supermind;
    index index.html;

    # 超脑官网原有内容
    location / { try_files $uri $uri/ =404; }

    # 作品和预览都不允许公开读取 dotfile；ACME 的 .well-known 例外保留。
    location ~ /\.(?!well-known(?:/|$)) { deny all; }

    # ── 学员作品（正式版）──────────────────────────────────────────
    # nginx 直接 serve 静态文件，**不经过 Node 进程**，作品数量增长不影响平台
    location ~ ^/vibehub/(?<vh_user>[a-z0-9][a-z0-9_-]*)/(?<vh_proj>[a-z0-9][a-z0-9_-]*)(?<vh_rest>/.*)?$ {
        alias /var/lib/vibehub/sites/$vh_user/$vh_proj;
        try_files $vh_rest $vh_rest/index.html /index.html =404;

        # 学员代码不可信：禁止把控制台嵌进作品页做钓鱼
        add_header Content-Security-Policy "frame-ancestors 'self' https://hub.supermind-ai.cn" always;
        add_header X-Content-Type-Options nosniff always;

        # 作品会频繁更新，别让浏览器缓存太久
        add_header Cache-Control "public, max-age=60" always;
    }

    # ── 版本预览（不可猜 id，禁止收录）──────────────────────────────
    location ~ ^/vibehub/_preview/(?<vh_pid>[a-z0-9]{16})(?<vh_prest>/.*)?$ {
        alias /var/lib/vibehub/previews/$vh_pid;
        try_files $vh_prest $vh_prest/index.html /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # ── 作品运行时 SDK 与 BaaS 接口 ────────────────────────────────
    location /vibehub/_sdk/ {
        proxy_pass http://127.0.0.1:4300;
        add_header Cache-Control "public, max-age=300" always;
    }
    location /baas/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 项目身份由 Referer 里的作品路径推导，必须透传
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Vibehub-Project "";
        client_max_body_size 25m;
    }

    # 作品浏览量统计走后端（nginx 直出的静态文件不经过 Node，
    # 所以 index.html 单独回源一次记一笔）
    location = /vibehub/_hit { proxy_pass http://127.0.0.1:4300; }
}

# ── 控制台 + API（独立 origin）───────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name hub.supermind-ai.cn;

    ssl_certificate     /etc/letsencrypt/live/supermind-ai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supermind-ai.cn/privkey.pem;

    # 控制台绝不允许被嵌进 iframe——防止学员作品做钓鱼页
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /var/www/vibehub-console;   # web/dist 的部署位置
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 35m;    # 提交包上限 30 MB，留点余量
        proxy_read_timeout 120s;
    }

    location /healthz { proxy_pass http://127.0.0.1:4300; }

    # SPA 路由
    location / { try_files $uri $uri/ /index.html; }
}

# ── 80 全部跳 443 ────────────────────────────────────────────────────
server {
    listen 80;
    server_name supermind-ai.cn www.supermind-ai.cn hub.supermind-ai.cn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
